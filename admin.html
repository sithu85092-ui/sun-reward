<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SUN REWARD Admin</title>
  <link rel="stylesheet" href="/admin.css">
</head>
<body>
  <main class="wrap">
    <header><div class="logo">☀ SUN REWARD</div><h1>Admin Panel</h1><p>Social tasks, links and manual proof review</p></header>
    <section class="panel">
      <label for="admin-key">Admin Key (not shared)</label>
      <div class="inline"><input id="admin-key" type="password" autocomplete="current-password" placeholder="Enter ADMIN_KEY"><button id="connect">Connect</button></div>
      <p id="connection" class="muted">Not connected</p>
    </section>
    <nav class="tabs">
      <button data-tab="tasks" class="active">Tasks</button>
      <button data-tab="links">Links</button>
      <button data-tab="submissions">Submissions</button>
    </nav>
    <section id="tab-tasks" class="panel">
      <h2>Create a task</h2>
      <form id="task-form">
        <input id="task-id" placeholder="ID e.g. telegram_join (leave blank for auto)">
        <input id="task-title" required maxlength="120" placeholder="Task title">
        <textarea id="task-description" maxlength="500" placeholder="Description"></textarea>
        <input id="task-url" type="url" required placeholder="https://...">
        <input id="task-points" type="number" min="0" max="1000000" required value="100" placeholder="Reward SUN">
        <button type="submit">Add task</button>
      </form>
      <h2>Existing tasks</h2><div id="task-list" class="stack"></div>
    </section>
    <section id="tab-links" class="panel hidden">
      <h2>Social links</h2>
      <form id="links-form">
        <label for="tiktok-url">TikTok URL</label><input id="tiktok-url" type="url" required>
        <label for="telegram-url">Telegram channel URL</label><input id="telegram-url" type="url" required>
        <button type="submit">Save links</button>
      </form>
    </section>
    <section id="tab-submissions" class="panel hidden">
      <h2>Task submissions</h2>
      <div class="inline"><label for="submission-status">Status</label>
        <select id="submission-status"><option value="pending">Pending</option><option value="approved">Approved</option><option value="rejected">Rejected</option></select>
        <button id="load-submissions" type="button">Refresh</button>
      </div>
      <div id="submission-list" class="stack"></div>
    </section>
    <p id="message" role="status"></p>
  </main>
  <script src="/admin.js"></script>
</body>
</html>
